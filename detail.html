<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>详情页 - 灵感档案馆</title>
<style>
  :root {
    --color-primary: #ff007f;
    --color-secondary: #0022ff;
    --color-accent: #8b5cf6;
    --color-bg: #ffffff;
    --color-surface: rgba(255, 255, 255, 0.7);
    --color-border: rgba(0, 0, 0, 0.04);
    --color-text-primary: #000000;
    --color-text-secondary: #555555;
    --color-text-tertiary: #999999;
    --blur: 24px;
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
      "Segoe UI", "Microsoft YaHei", sans-serif;
    background-color: var(--color-bg);
    color: var(--color-text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* 中心化极简流体光斑 */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.8;
  }
  .glow-1 { 
    top: -10%; left: -10%; 
    width: 500px; height: 500px; 
    background: #ff007f; 
    animation: float1 15s ease-in-out infinite alternate;
  }
  .glow-2 { 
    top: 40%; right: -10%; 
    width: 600px; height: 600px; 
    background: #0022ff; 
    animation: float2 18s ease-in-out infinite alternate;
  }
  .glow-3 {
    bottom: -20%; left: 20%;
    width: 450px; height: 450px;
    background: #8b5cf6;
    animation: float3 20s ease-in-out infinite alternate;
  }

  @keyframes float1 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 80px) scale(1.1); } }
  @keyframes float2 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-60px, 50px) scale(1.15); } }
  @keyframes float3 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-30px, -60px) scale(1.05); } }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 60px 28px 120px;
    animation: smoothEntry 0.7s ease-out;
  }

  @keyframes smoothEntry { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--color-text-secondary);
    text-decoration: none;
    margin-bottom: 48px;
    transition: color 0.3s ease;
  }
  .back-btn:hover {
    color: var(--color-text-primary);
  }

  .detail-header {
    margin-bottom: 40px;
  }
  .detail-title {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 16px;
  }
  .detail-desc {
    font-size: 1.15rem;
    color: var(--color-text-secondary);
    font-weight: 300;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  .tag {
    font-size: 0.8rem; font-weight: 600;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(0,0,0,0.04);
    color: var(--color-text-secondary);
  }

  .detail-cover {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: var(--radius-lg);
    background-size: cover;
    background-position: center;
    margin-bottom: 48px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.08);
    display: none; /* 默认隐藏，有图时显示 */
  }

  .detail-content {
    font-size: 1.05rem;
    line-height: 1.8;
    color: var(--color-text-primary);
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(32px) saturate(120%);
    -webkit-backdrop-filter: blur(32px) saturate(120%);
    padding: 40px;
    border-radius: var(--radius-lg);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 
      0 16px 40px rgba(0, 0, 0, 0.04), 
      inset 0 2px 2px rgba(255, 255, 255, 0.8);
  }
  .detail-content p { margin-bottom: 1.2em; }
  
  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 40px;
    padding: 16px 36px;
    background: #000;
    color: #fff;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.05rem;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .action-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <div class="wrap">
    <a href="index.html" class="back-btn">← 返回首页</a>
    
    <div id="detail-container">
      <!-- 渲染内容将放置在这里 -->
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    function esc(s = "") {
      return String(s).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // 从 URL 获取传递过来的标题参数
    const urlParams = new URLSearchParams(window.location.search);
    const itemTitle = urlParams.get('title');

    // 查找对应的数据
    let currentItem = null;
    for (const col of collections) {
      const found = col.items.find(it => it.title === itemTitle);
      if (found) {
        currentItem = found;
        break;
      }
    }

    const container = document.getElementById("detail-container");

    if (!currentItem) {
      container.innerHTML = `
        <h1 class="detail-title">未找到内容</h1>
        <p class="detail-desc">抱歉，无法找到该项目的详细信息。</p>
      `;
    } else {
      document.title = `${currentItem.title} - ${SITE.title}`;
      
      const tagsHTML = (currentItem.tags && currentItem.tags.length)
        ? `<div class="tags">${currentItem.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>`
        : "";

      let coverHTML = "";
      if (currentItem.image && currentItem.image.trim()) {
        coverHTML = `<div class="detail-cover" style="display: block; background-image: url('${esc(currentItem.image)}')"></div>`;
      }

      // 如果提供了 content 则展示 content，否则展示默认的 desc
      const mainContent = currentItem.content || `<p>${esc(currentItem.desc || '暂无详细介绍。')}</p>`;
      
      let linkBtnHTML = "";
      if (currentItem.url && currentItem.url !== "#") {
        linkBtnHTML = `<a href="${esc(currentItem.url)}" target="_blank" rel="noopener" class="action-btn">访问源网页 ↗</a>`;
      }

      container.innerHTML = `
        <header class="detail-header">
          <h1 class="detail-title">${esc(currentItem.title)}</h1>
          ${currentItem.desc ? `<p class="detail-desc">${esc(currentItem.desc)}</p>` : ""}
          ${tagsHTML}
        </header>

        ${coverHTML}

        <div class="detail-content">
          ${mainContent}
        </div>
        
        ${linkBtnHTML}
      `;
    }
  </script>
</body>
</html>
